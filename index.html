    const x = papel(FPA._para), pe = persona(x.personaId), pr = proyecto(x.proyectoId);
    if (!await confirmar('Use esta opción solo si fue un error. Si la persona dejó el proyecto, mejor use “Ya no está en el proyecto” para conservar la historia.', {titulo:'Quitar del proyecto', si:'Quitar', peligro:true})) return;
    await aPapelera(`Rol de ${pe?.nombre || ''} en ${pr?.nombre || ''}`, {papeles:[x]});
    FPA = null; aviso('Quitada del proyecto'); volver('#/persona/' + x.personaId);
  },
  /* Compromisos */
  'comp-toggle': b => alternarCompromiso(b.dataset.id),
  /* Juntas */
  'fj-tipo': b => { FJ.tipo = b.dataset.v; reJunta(); },
  'fj-asis': b => { const v = b.dataset.v; FJ.asistentes = FJ.asistentes.includes(v) ? FJ.asistentes.filter(x => x !== v) : [...FJ.asistentes, v]; reJunta(); },
  'fj-inv-add': b => { if (!FJ.invitados.some(x => x.id === b.dataset.id)) FJ.invitados.push({id:b.dataset.id}); FJ.invBusq = ''; reJunta(); },
  'fj-inv-crear': () => { const n = FJ.invBusq.trim(); if (!n) return; FJ.invitados.push({id:uid(), nombre:n}); FJ.invBusq = ''; reJunta(); },
  'fj-inv-quitar': b => { FJ.invitados.splice(+b.dataset.i, 1); reJunta(); },
  'fj-asisti': b => { FJ.asisti = b.dataset.v === '1'; reJunta(); },
  'fj-motivo': b => { FJ.motivo = b.dataset.v; reJunta(); },
  'fj-fuente': b => { FJ.fuente = FJ.fuente === b.dataset.v ? '' : b.dataset.v; reJunta(); },
  'fj-acta': b => { FJ.acta = b.dataset.v; if (FJ.acta === 'recibida' && !FJ.actaFecha) FJ.actaFecha = hoyISO(); reJunta(); },
  'fj-borrar': async () => {
    const r = reunion(FJ._para), e = empresa(r.empresaId);
    if (!await confirmar(`La junta del ${fechaMedia(r.fecha)} irá a la papelera ${PAPELERA_DIAS} días. Sus notas y compromisos se conservan; si la restaura, vuelven a quedar enlazados.`, {titulo:'Eliminar junta', si:'Eliminar', peligro:true})) return;
    await aPapelera(`Junta del ${fechaMedia(r.fecha)} · ${e?.nombre || ''}`, {reuniones:[r]});
    FJ = null; aviso('Junta enviada a la papelera'); profundidad = 0; reemplazar('#/empresa/' + r.empresaId);
  },
  'junta-unir': b => unirNotasJunta(b.dataset.id),
  'fn-junta': b => { FN.reunionId = b.dataset.id; const r = reunion(FN.reunionId); if (r && !FN.ocasion.trim()) FN.ocasion = ocasionJunta(r); guardarBorrador(); reNota(); },
  'rol-hoja': b => hojaRol(b.dataset.id),
  'pend-f': b => { PEND_F = b.dataset.f; vistaPendientes(); },
  'fco-hito': b => { FCO.hitoId = b.dataset.id; vistaCompromiso(FCO._para === 'nuevo' ? undefined : FCO._para, ruta().q); },
  'fco-estado': b => { FCO.cumplido = b.dataset.v === '1'; if (FCO.cumplido && !FCO.fechaCumplido) FCO.fechaCumplido = hoyISO(); vistaCompromiso(FCO._para === 'nuevo' ? undefined : FCO._para, ruta().q); },
  'fco-borrar': async () => {
    const c = compromiso(FCO._para);
    if (!await confirmar('El compromiso irá a la papelera. Si ya se cumplió, mejor márquelo como cumplido.', {titulo:'Eliminar compromiso', si:'Eliminar', peligro:true})) return;
    await aPapelera(`Compromiso: ${c.descripcion.slice(0, 50)}`, {compromisos:[c]});
    FCO = null; aviso('Compromiso enviado a la papelera'); volver(rutaCompromiso(c));
  },
  convertir: b => hojaConvertir(b.dataset.id),
  'papelera-restaurar': b => restaurarPapelera(b.dataset.id),
  'papelera-eliminar': async b => {
    const it = S.papelera.find(x => x.id === b.dataset.id); if (!it) return;
    if (!await confirmar(`“${it.titulo}” se eliminará definitivamente. No se puede deshacer.`, {titulo:'Eliminar definitivamente', si:'Eliminar', peligro:true})) return;
    await lote({quitar:{papelera:[it.id]}}); aviso('Eliminado'); render();
  }
};

/* =====================================================================
   EVENTOS GLOBALES Y ARRANQUE
   ===================================================================== */
document.addEventListener('click', async e => {
  const a = e.target.closest('[data-action]');
  if (a) {
    if (a.disabled) return;
    e.preventDefault(); e.stopPropagation();
    const fn = ACCIONES[a.dataset.action];
    if (fn) { try { await fn(a, e); } catch (err) { console.error(err); mensaje('Ocurrió un error: ' + (err.message || err), 'Algo salió mal'); } }
    return;
  }
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); ir(g.dataset.go); return; }
  const l = e.target.closest('a[href^="#/"]');
  if (l) { e.preventDefault(); ir(l.getAttribute('href')); }
});
document.addEventListener('keydown', e => {
  if (bloqueada && !HOJA) {
    if (/^[0-9]$/.test(e.key)) pinTecla(e.key);
    else if (e.key === 'Backspace') pinBorrar();
    else if (e.key === 'Enter') pinEnviar();
    return;
  }
  if (e.key === 'Escape' && HOJA) { cerrarHoja(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-go]')) { e.preventDefault(); ir(e.target.dataset.go); }
});
window.addEventListener('hashchange', render);
$('#archivo-respaldo').addEventListener('change', e => { const f = e.target.files[0]; if (f) importarRespaldo(f); });
$('#archivo-csv').addEventListener('change', e => { const f = e.target.files[0]; if (f) cargarCSV(f); });
let ocultaDesde = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { ocultaDesde = Date.now(); if (FN) guardarBorrador(true); }
  else if (!bloqueada && ocultaDesde && Date.now() - ocultaDesde > BLOQUEO_MIN * 60000) bloquear();
});

async function iniciar(){
  document.title = APP.nombre;
  $('meta[name="apple-mobile-web-app-title"]').content = APP.nombre;
  if (!window.indexedDB || !window.crypto?.subtle) {
    bloqueo.innerHTML = `<div class="pin"><div class="pin-cabeza"><div class="pin-logo">${estrella(30)}</div><h1 class="pin-nombre">${esc(APP.nombre)}</h1><p class="pin-instr">Este navegador no permite guardar datos de forma segura. Abra la app desde su dirección https en Chrome, Edge o Safari.</p></div></div>`;
    return;
  }
  try {
    db = await abrirDB();
    await cargarTodo();
    await asegurarTiposBase();
    await purgarPapelera();
    aplicarTema();
  } catch (err) {
    bloqueo.innerHTML = `<div class="pin"><div class="pin-cabeza"><h1 class="pin-nombre">${esc(APP.nombre)}</h1><p class="pin-instr">No se pudo abrir la base de datos (${esc(err.message || err)}). Si está en modo incógnito, ábrala en una ventana normal.</p></div></div>`;
    return;
  }
  bloquear();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}
iniciar();
</script>
