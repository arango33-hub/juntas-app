<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mentor</title>
<meta name="description" content="App personal para recordar a la gente de las entidades y juntas directivas.">
<meta name="theme-color" content="#18202B">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mentor">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<script>
/* Tema antes de pintar: claro, oscuro o según el sistema */
(function(){ var t = 'sistema'; try { t = localStorage.getItem('tema') || 'sistema'; } catch (e) {}
  var o = t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-tema', o ? 'oscuro' : 'claro'); })();
</script>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* =====================================================================
   1. COLORES — único lugar donde se definen. Tema "Azul noche".
   ===================================================================== */
:root{
  color-scheme:light;
  /* Superficies */
  --fondo:#F4F5F7;            /* fondo de pantallas */
  --tarjeta:#FFFFFF;          /* tarjetas y cabeceras */
  --borde:#E1E4E9;            /* borde de tarjetas */
  --borde-campo:#D3D8DF;      /* borde de campos y chips */
  --borde-punteado:#B9C1CC;   /* tarjeta de empresa sin junta */
  --linea:#EEF0F3;            /* separadores dentro de tarjetas */
  --neutro-suave:#EEF0F3;     /* etiquetas neutras */
  /* Texto */
  --texto:#18202B;
  --texto-2:#5A6472;
  --punto:#9AA4B1;            /* puntos de la línea de tiempo */
  /* Acento */
  --acento:#1E5A86;
  --acento-hover:#143F60;
  --acento-suave:#E6EEF5;
  --acento-texto:#143F60;     /* texto de chip seleccionado */
  --boton:#1E5A86;
  --boton-texto:#FFFFFF;
  --filtro-activo:#18202B;
  --filtro-activo-texto:#FFFFFF;
  --yo-fondo:#18202B;         /* avatar "Yo" */
  --yo-texto:#FFFFFF;
  /* Pendientes y alertas (igual en todos los temas) */
  --pend-texto:#A44A12;
  --pend-fondo:#FBEFE6;
  --pend-fuerte:#7A3509;
  --peligro:#A3262A;
  /* Pantalla de PIN y logo */
  --pin-fondo:#18202B;
  --pin-tecla:#26313F;
  --pin-acento:#9CC3E0;
  --pin-texto:#FFFFFF;
  --pin-texto-2:#B8C2CF;
  --pin-vacio:#5A6878;
  --pin-error:#F2B48A;
  --logo-fondo:#18202B;
  --logo-estrella:#FFFFFF;
  --logo-punto:#9CC3E0;
  /* Paleta de 8 colores por empresa */
  --emp-azul:#1E5A86;
  --emp-verde:#2E6B4F;
  --emp-vino:#7A2E3F;
  --emp-turquesa:#1F6F78;
  --emp-morado:#5B3F8C;
  --emp-mostaza:#8A6D1E;
  --emp-rosa:#8C3F62;
  --emp-grafito:#4A5361;
  /* Otros */
  --velo:rgba(10,14,20,.45);
  --sombra:0 10px 30px rgba(24,32,43,.18);
  --mezcla-avatar:11%;        /* intensidad del color de empresa en avatares */
  --f-titulo:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --f-texto:'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
/* Modo oscuro: se activa con data-tema="oscuro" (según el sistema o la elección en Ajustes) */
:root[data-tema="oscuro"]{
  color-scheme:dark;
    --fondo:#0F141A;
    --tarjeta:#18202B;
    --borde:#2A3441;
    --borde-campo:#3A4553;
    --borde-punteado:#4A5563;
    --linea:#232D39;
    --neutro-suave:#252F3B;
    --texto:#E8ECF1;
    --texto-2:#9EAAB8;
    --punto:#5E6B7A;
    --acento:#7DB3DE;
    --acento-hover:#A3CBEA;
    --acento-suave:#1B2E40;
    --acento-texto:#C4DDF1;
    --boton:#2B6A99;
    --boton-texto:#FFFFFF;
    --filtro-activo:#E8ECF1;
    --filtro-activo-texto:#0F141A;
    --yo-fondo:#E8ECF1;
    --yo-texto:#0F141A;
    --pend-texto:#F2A56B;
    --pend-fondo:#3A2416;
    --pend-fuerte:#F6C29B;
    --peligro:#F08A8D;
    --velo:rgba(0,0,0,.6);
    --sombra:0 10px 30px rgba(0,0,0,.5);
    --mezcla-avatar:40%;
}

/* =====================================================================
   2. BASE
   ===================================================================== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--f-texto);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;min-height:100dvh}
a{color:var(--acento)}a:hover{color:var(--acento-hover)}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;color:var(--texto)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex-shrink:0}

/* Estructura */
.pagina{max-width:760px;margin:0 auto;position:relative}
.con-nav{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.con-accion{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.banda{background:var(--tarjeta);border-bottom:1px solid var(--borde);padding-top:env(safe-area-inset-top)}
.cabecera{max-width:760px;margin:0 auto;padding:20px 20px 24px;display:flex;flex-direction:column;gap:14px}
.cab-fila{display:flex;justify-content:space-between;align-items:center;gap:12px}
.volver{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-size:15px;text-decoration:none;color:var(--acento);background:none;border:0;padding:0;align-self:flex-start;text-align:left}
.enlace-btn{min-height:44px;border:0;background:transparent;color:var(--acento);font-size:15px;font-weight:600;padding:0 4px;text-decoration:none;display:inline-flex;align-items:center}
.serif{margin:0;font-family:var(--f-titulo);font-weight:600}
.t30{font-size:30px}.t28{font-size:28px;line-height:1.15}.t26{font-size:26px}
.sec{padding:24px 20px 0;display:flex;flex-direction:column;gap:12px}
.sec.mas{padding-top:28px}
.sec-titulo{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--texto-2)}
.sec-fila{display:flex;justify-content:space-between;align-items:center}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.nom{font-weight:600;font-size:15px}
.sub{font-size:13px;color:var(--texto-2)}
.t2{color:var(--texto-2)}
.vacio{margin:0;padding:16px;font-size:15px;line-height:1.5;color:var(--texto-2)}
a.vacio-toque{display:block;text-decoration:none;color:var(--texto-2)}
.fila.fila-agregar{color:var(--acento);font-weight:600;border-bottom:0}
.parrafo{margin:0;padding:16px;font-size:15px;line-height:1.5;white-space:pre-line}

/* Filas dentro de tarjetas */
.fila{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--linea);text-decoration:none;color:var(--texto);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-size:inherit}
.fila:last-child{border-bottom:0}
.fila .chev{margin-left:auto}
a.fila:hover,button.fila:hover{color:var(--texto);background:color-mix(in srgb,var(--acento-suave) 45%,transparent)}
.av{width:40px;height:40px;border-radius:50%;background:var(--acento-suave);color:var(--acento);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
.av-emp{background:var(--acento-suave);background:color-mix(in srgb,var(--c) var(--mezcla-avatar),var(--tarjeta));color:var(--c)}
:root[data-tema="oscuro"] .av-emp{color:#FFFFFF}
.av-yo{background:var(--yo-fondo);color:var(--yo-texto)}
.carrusel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:2px 20px 6px;scroll-padding-inline:20px;scrollbar-width:none}
.carrusel::-webkit-scrollbar{display:none}
.prox-card{flex:0 0 272px;scroll-snap-align:start;background:var(--tarjeta);border:1px solid var(--borde);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--texto)}
.prox-card .banda-c{height:6px;background:var(--c)}
.prox-card .cuerpo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.prox-fecha{width:58px;height:64px;border-radius:14px;background:var(--acento-suave);color:var(--acento);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.prox-fecha .d{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.prox-fecha .n{font-family:var(--f-titulo);font-size:26px;font-weight:600;line-height:1;color:var(--acento-texto)}
.prox-fecha.hoy{background:var(--pend-fondo);color:var(--pend-texto)}
.prox-fecha.hoy .n{color:var(--pend-fuerte, var(--pend-texto))}
.chip-info{font-size:12px;padding:4px 8px;border-radius:8px;background:var(--neutro-suave);color:var(--texto-2)}
.chip-info.pend{background:var(--pend-fondo);color:var(--pend-texto);font-weight:600}
.prox-btn{padding:9px 14px;border-radius:12px;background:var(--boton);color:var(--boton-texto);font-size:14px;font-weight:600}
.cal-tarjeta{touch-action:pan-y}
.cal-mes-entra-sig{animation:calSig .22s ease-out}
.cal-mes-entra-ant{animation:calAnt .22s ease-out}
@keyframes calSig{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes calAnt{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.cal-mes-entra-sig,.cal-mes-entra-ant{animation:none}}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dia{height:44px;border-radius:10px;border:0;background:none;color:var(--texto);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0}
.cal-dia .n{font-size:14px;font-weight:500}
.cal-dia.pasado .n{color:var(--punto)}
.cal-dia.hoy{background:var(--filtro-activo);color:var(--filtro-activo-texto)}
.cal-dia.hoy .n{color:var(--filtro-activo-texto);font-weight:700}
.cal-dia.sel{box-shadow:inset 0 0 0 2px var(--acento)}
.cal-puntos{display:flex;gap:2px;height:6px}
.cal-punto,.pulso-punto{width:6px;height:6px;border-radius:50%;background:var(--c)}
:root[data-tema="oscuro"] .cal-punto,:root[data-tema="oscuro"] .prox-card .banda-c{background:color-mix(in srgb,var(--c) 62%,#fff)}
.pulso{display:flex;flex-direction:column;gap:6px}
.pulso svg{display:block;width:100%;height:40px}
.pulso-txt{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--texto-2)}
.pulso-txt .frio{color:var(--pend-texto);font-weight:600}
.anio-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.anio-mes{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;border-radius:10px;text-decoration:none;color:var(--texto-2);font-size:12px}
.anio-mes.actual{background:var(--acento-suave);color:var(--acento-texto);font-weight:700}
.anio-puntos{display:flex;gap:4px;height:12px;align-items:center;flex-wrap:nowrap}
.ma{width:11px;height:11px;box-sizing:border-box;background:var(--acento);flex-shrink:0}
.ma-j{border-radius:50%}
.ma-c{border-radius:3px;background:var(--turq, #2E9C8F)}
.ma-s{transform:rotate(45deg) scale(.8);background:var(--mostaza, #A88A2E)}
:root[data-tema="oscuro"] .ma-c{background:#5FC2B4}
:root[data-tema="oscuro"] .ma-s{background:#C9B27A}
.ma.no{background:none;border:2px solid var(--acento)}
.ma-c.no{border-color:#2E9C8F}.ma-s.no{border-color:#A88A2E}
.ma.prog{background:none;border:2px dashed var(--acento)}
.ma-c.prog{border-color:#2E9C8F}.ma-s.prog{border-color:#A88A2E}
:root[data-tema="oscuro"] .ma-c.no,:root[data-tema="oscuro"] .ma-c.prog{border-color:#5FC2B4}
:root[data-tema="oscuro"] .ma-s.no,:root[data-tema="oscuro"] .ma-s.prog{border-color:#C9B27A}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--texto-2)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.num-grande{font-family:var(--f-titulo);font-size:28px;font-weight:600;line-height:1.1;white-space:nowrap;color:var(--texto)}
.caja-cifra{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--texto-2)}
.donas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dona{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;color:var(--texto);cursor:pointer}
.dona.act{border:2px solid var(--acento)}
.dona .t{font-size:13px;font-weight:600;text-align:center;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dona .s{font-size:11px;color:var(--texto-2)}
.dona .s.pend{color:var(--pend-texto)}
.camino{display:flex;align-items:center}
.camino .p{width:24px;height:24px;border-radius:50%;box-sizing:border-box;border:2px solid var(--borde-campo);color:var(--texto-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.camino .p.ok{background:var(--acento);border-color:var(--acento);color:var(--tarjeta)}
.camino .p.ya{width:32px;height:32px;border:3px solid var(--acento);background:var(--acento-suave);color:var(--acento-texto);font-size:13px}
.camino .l{flex:1;height:3px;min-width:6px;background:var(--borde)}
.camino .l.ok{background:var(--acento)}
.camino.mini .p{width:12px;height:12px;border-width:2px;font-size:0}
.camino.mini .p.ya{width:16px;height:16px;border-width:3px}
.camino.mini .l{height:2px}
.mm{overflow-x:auto;padding:4px 0 12px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.mm-raiz{align-self:stretch;text-align:center;background:var(--boton);color:var(--boton-texto);border-radius:16px;padding:12px 16px;font-weight:700;font-size:16px;line-height:1.3}
.mm-arbol{display:flex;align-items:center;width:max-content}
.mm-hijos{display:flex;flex-direction:column;padding-left:28px;position:relative}
.mm-hijos::before{content:'';position:absolute;left:0;top:50%;width:14px;border-top:2px solid var(--c)}
.mm-item{display:flex;align-items:center;position:relative;padding:4px 0}
.mm-item::before{content:'';position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--c)}
.mm-item::after{content:'';position:absolute;left:-14px;top:0;bottom:0;border-left:2px solid var(--c)}
.mm-item:first-child::after{top:50%}
.mm-item:last-child::after{bottom:50%}
.mm-item:only-child::after{display:none}
.mm-nodo{font:inherit;text-align:left;color:var(--texto);background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.35;max-width:200px;cursor:default}
.mm-rama{background:color-mix(in srgb,var(--c) 16%,var(--tarjeta));border:2px solid var(--c);font-weight:600;font-size:15px;max-width:150px}
button.mm-nodo{cursor:pointer}
.mm-mas{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:var(--acento)}
.pleg-cab{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 14px 12px 16px;background:none;border:0;color:var(--texto);font:inherit;text-align:left;cursor:pointer}
.pleg-res{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pleg-res .nom{font-size:16px;font-weight:600}
.pleg-res .sub{font-size:13px;color:var(--texto-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pleg-flecha{width:34px;height:34px;border-radius:50%;background:var(--acento-suave);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .22s ease}
.plegable.abierta .pleg-flecha{transform:rotate(180deg)}
.pleg-cuerpo{display:none;border-top:1px solid var(--linea)}
.plegable.abierta .pleg-cuerpo{display:block}
.area-tit{padding:12px 16px 4px;font-size:12px;font-weight:600;color:var(--texto-2);text-transform:uppercase;letter-spacing:.05em}
.func{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;text-decoration:none;color:var(--texto)}
.func.fin-grupo{padding-bottom:14px;border-bottom:1px solid var(--linea)}
.func.fin-grupo:last-child{border-bottom:0;padding-bottom:16px}
a.func:hover{color:var(--texto);background:color-mix(in srgb,var(--acento-suave) 45%,transparent)}

/* Etiquetas */
.pild{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pild-acento{color:var(--acento);background:var(--acento-suave)}
.pild-neutra{color:var(--texto-2);background:var(--neutro-suave)}
.etiquetas{display:flex;flex-wrap:wrap;gap:8px}
.etq{font-size:13px;color:var(--texto);background:var(--neutro-suave);padding:6px 12px;border-radius:999px}
.etq.fuerte{font-weight:600}
.etq.acento{font-weight:600;color:var(--acento);background:var(--acento-suave)}

/* Botones */
.btn-icono{width:44px;height:44px;border-radius:12px;border:1px solid var(--borde);background:var(--tarjeta);display:flex;align-items:center;justify-content:center;color:var(--texto);text-decoration:none;padding:0}
.btn-icono:hover{color:var(--texto)}
.btn-pri,.btn-sec,.btn-peligro{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:16px;font-weight:600;font-size:16px;text-decoration:none;width:100%;padding:0 16px;border:0;text-align:center}
.btn-pri{background:var(--boton);color:var(--boton-texto)}
.btn-pri:hover{color:var(--boton-texto);filter:brightness(1.08)}
.btn-sec{min-height:48px;border-radius:12px;border:1px solid var(--borde-campo);background:var(--tarjeta);color:var(--texto);font-weight:500;font-size:15px}
.btn-peligro{min-height:48px;border-radius:12px;border:1px solid var(--borde-campo);background:var(--tarjeta);color:var(--peligro);font-size:15px}
.btn-peligro.lleno{background:var(--peligro);color:#fff;border:0}
.btn-pri[disabled]{opacity:.5;cursor:default}
.accion-fija{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding:24px 20px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--fondo) 55%,transparent)}
.accion-fija > *{pointer-events:auto;max-width:720px;margin:0 auto}
.accion-fija .btn-pri{background:var(--c,var(--boton))}

/* Franjas (pendientes, recordatorios) */
.franja{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--pend-fondo);border:0;text-align:left;width:100%;text-decoration:none;color:var(--pend-fuerte)}
.franja:hover{color:var(--pend-fuerte)}
.franja-t{font-weight:600;font-size:15px;color:var(--pend-fuerte)}
.franja-s{font-size:13px;color:var(--pend-fuerte)}
.franja.info{background:var(--acento-suave);color:var(--acento-texto)}
.franja.info .franja-t,.franja.info .franja-s{color:var(--acento-texto)}

/* Navegación inferior y botón + */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tarjeta);border-top:1px solid var(--borde);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:760px;margin:0 auto;height:76px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nav a,.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--texto-2);text-decoration:none;background:none;border:0;padding:0}
.nav .act{font-weight:600;color:var(--acento)}
.fab{position:fixed;z-index:31;right:max(20px,calc((100vw - 760px)/2 + 20px));bottom:calc(96px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--boton);color:var(--boton-texto);display:flex;align-items:center;justify-content:center;box-shadow:var(--sombra)}
.fab:hover{color:var(--boton-texto)}

/* =====================================================================
   3. PANTALLA DE PIN (mockup 1)
   ===================================================================== */
#bloqueo{position:fixed;inset:0;z-index:100;background:var(--pin-fondo);color:var(--pin-texto);overflow:auto}
.pin{min-height:100%;max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:calc(clamp(40px,11vh,96px) + env(safe-area-inset-top)) 32px calc(clamp(24px,6vh,48px) + env(safe-area-inset-bottom));gap:clamp(24px,4.7vh,40px)}
.pin-cabeza{display:flex;flex-direction:column;align-items:center;gap:12px}
.pin-logo{width:56px;height:56px;border-radius:16px;background:var(--pin-tecla);display:flex;align-items:center;justify-content:center}
.pin-nombre{margin:0;font-family:var(--f-titulo);font-weight:600;font-size:30px}
.pin-instr{margin:0;font-size:15px;color:var(--pin-texto-2);text-align:center;min-height:20px}
.pin-instr.error{color:var(--pin-error)}
.pin-puntos{display:flex;gap:18px}
.pin-puntos div{width:14px;height:14px;border-radius:50%;border:2px solid var(--pin-vacio)}
.pin-puntos div.lleno{background:var(--pin-acento);border:0}
.pin-puntos.sacude{animation:sacude .35s}
@keyframes sacude{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-teclado{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;max-width:280px}
.pin-tecla{height:64px;border-radius:32px;border:0;background:var(--pin-tecla);color:var(--pin-texto);font-size:24px}
.pin-tecla:active{filter:brightness(1.35)}
.pin-borrar{height:64px;border-radius:32px;border:0;background:transparent;color:var(--pin-texto-2);display:flex;align-items:center;justify-content:center}
.pin-entrar{margin-top:auto;display:block;width:100%;max-width:280px;text-align:center;padding:16px;border-radius:14px;background:var(--pin-acento);color:#18202B;font-weight:600;font-size:16px;border:0}
.pin-pie{margin:0;font-size:13px;color:var(--pin-texto-2);text-align:center}
.pin-ligero{margin-top:-28px;min-height:44px;border:0;background:none;color:var(--pin-acento);font-size:14px;text-decoration:underline}

/* =====================================================================
   4. INICIO (mockup 2)
   ===================================================================== */
.ini-top{padding:calc(32px + env(safe-area-inset-top)) 20px 0;display:flex;flex-direction:column;gap:16px}
.ini-botones{display:flex;gap:8px}
.campo-busq{display:flex;flex-direction:column;gap:6px}
.campo-busq label{font-size:13px;color:var(--texto-2)}
.input{height:48px;width:100%;padding:0 16px;border-radius:12px;border:1px solid var(--borde-campo);background:var(--tarjeta);font-size:16px}
textarea.input{height:auto;min-height:120px;padding:12px 16px;line-height:1.5;resize:vertical}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--texto-2) 50%),linear-gradient(135deg,var(--texto-2) 50%,transparent 50%);background-position:calc(100% - 22px) 21px,calc(100% - 16px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.input[disabled]{opacity:1}
.input[aria-invalid="true"]{border-color:var(--peligro)}
.filtros{display:flex;gap:8px;flex-wrap:wrap}
.filtro{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--borde-campo);background:var(--tarjeta);color:var(--texto);font-size:14px}
.btn-orden{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--acento)}
.btn-orden.on{border:2px solid var(--acento);background:var(--acento-suave);color:var(--acento-texto);padding:0 13px}
.sep-grupo{border:0;border-top:1px solid var(--borde-campo);margin:20px 0 0}
.grupo-cab{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--texto-2);margin:14px 0 8px;text-decoration:none}
.grupo-cab .punto-emp{width:12px;height:12px}
.filtro.act{border:0;background:var(--filtro-activo);color:var(--filtro-activo-texto);font-weight:600;padding:0 15px}
.emp-grid{display:grid;grid-template-columns:1fr;gap:12px}
.emp-card{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;background:var(--tarjeta);border:1px solid var(--borde);text-decoration:none;color:var(--texto);cursor:pointer}
.emp-card.punteada{border:1px dashed var(--borde-punteado)}
.emp-card:hover{border-color:var(--borde-punteado)}
.emp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.emp-nom-fila{display:flex;align-items:center;gap:10px;min-width:0}
.circulo{width:28px;height:28px;flex-shrink:0;border-radius:50%;border:0;padding:0}
.circulo.sel{border:3px solid var(--texto)}
.emp-nombre{font-weight:600;font-size:17px}
.emp-linea{font-size:14px;color:var(--texto-2)}
.emp-pie{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.pend{color:var(--pend-texto);font-weight:600}
.res-titulo{margin-top:8px}
@media (min-width:720px){.emp-grid{grid-template-columns:1fr 1fr}}

/* =====================================================================
   5. COMPAÑÍA Y PERSONA (mockups 3 y 4)
   ===================================================================== */
.emp-cab{display:flex;align-items:center;gap:14px}
.emp-ini{width:52px;height:52px;flex-shrink:0;border-radius:14px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.colores{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.colores > span{font-size:13px;color:var(--texto-2)}
.detalle-rel{margin:0;font-size:14px;color:var(--texto-2)}
.per-cab{display:flex;align-items:center;gap:16px}
.per-cab .av{width:64px;height:64px;font-size:22px}
.per-cab .col{gap:4px}
.per-acciones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.per-acc{min-height:56px;border-radius:12px;border:1px solid var(--borde);background:var(--fondo);color:var(--texto);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none}
.per-acc:hover{color:var(--texto)}
.per-acc[aria-disabled="true"]{opacity:.4;pointer-events:none}
.datos{padding:4px 16px;display:flex;flex-direction:column}
.dato{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--linea);font-size:14px}
.dato:last-child{border-bottom:0}
.dato > span:first-child{color:var(--texto-2);flex-shrink:0}
.dato > span:last-child,.dato > a:last-child{text-align:right;overflow-wrap:anywhere}
.punto-emp{width:10px;height:10px;border-radius:50%;background:var(--c);flex-shrink:0}

/* Línea de tiempo */
.tl{display:flex;flex-direction:column}
.tl-item{display:flex;gap:14px;text-decoration:none;color:var(--texto);border-radius:10px}
.tl-item:hover{color:var(--texto);background:color-mix(in srgb,var(--acento-suave) 40%,transparent)}
.tl-eje{display:flex;flex-direction:column;align-items:center}
.tl-punto{width:12px;height:12px;border-radius:50%;background:var(--punto);margin-top:4px;flex-shrink:0}
.tl-linea{width:2px;flex:1;background:var(--borde-campo)}
.tl-cuerpo{display:flex;flex-direction:column;gap:4px;min-width:0}
.tl-cuerpo.espacio{padding-bottom:20px}
.tl-fecha{font-size:13px;font-weight:600;color:var(--texto-2)}
.tl-texto{font-size:15px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.tl-reu-cab{display:flex;align-items:center;gap:10px;width:100%;padding:0;background:none;border:0;color:var(--texto);font:inherit;text-align:left;cursor:pointer;min-height:44px}
.tl-reu-cab .col{flex:1;min-width:0;gap:2px}
.tl-reu-res{font-size:15px;font-weight:600}
.tl-reu .pleg-flecha{width:30px;height:30px}
.tl-reu:hover{background:none}
.tl-reu-acc a{text-decoration:none}
.tl-reu-acc{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:4px}
.tl-reu.abierta .pleg-flecha{transform:rotate(180deg)}
.tl-reu-cuerpo{display:none;flex-direction:column;gap:8px;padding-top:6px}
.tl-reu.abierta .tl-reu-cuerpo{display:flex}
.tl-sub{margin:4px 0 0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--texto-2)}
.tl-lista{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.tl-mes{margin:4px 0 12px;font-size:14px;font-weight:700;color:var(--texto-2)}
.tl-grupo + .tl-grupo{margin-top:8px}
.tl-anio{margin-top:10px}
.tl-anio .pleg-cuerpo{padding:14px 14px 4px}
.tl-item.primera .tl-punto{background:var(--c,var(--acento))}
.tl-item.primera .tl-fecha{color:var(--c,var(--acento))}
:root[data-tema="oscuro"] .tl-item.primera .tl-fecha{color:var(--acento)}

/* =====================================================================
   6. FORMULARIOS Y NOTA (mockups 6 y 7)
   ===================================================================== */
.form{max-width:640px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:24px;min-height:100dvh}
.form-cab{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.form-cab > :first-child{justify-self:start}
.form-cab .tit{font-weight:600;font-size:16px;text-align:center}
.form-cab .hueco{justify-self:end}
.campo{display:flex;flex-direction:column;gap:6px}
.campo > label,.leyenda{font-size:14px;font-weight:600;padding:0}
.campo .opc{font-weight:400;color:var(--texto-2)}
.ayuda{font-size:13px;color:var(--texto-2)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dos > *{min-width:0}
input[type=date].input{min-width:0;max-width:100%;padding:0 10px}
fieldset{margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{padding:0;margin-bottom:4px;font-size:14px;font-weight:600}
.grupo-tit{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--texto-2)}
.grupo-tit.sep{margin-top:6px}
.opc2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opc-btn{min-height:48px;border-radius:12px;border:1px solid var(--borde-campo);background:var(--tarjeta);color:var(--texto);font-size:15px}
.opc-btn.sel{border:2px solid var(--acento);background:var(--acento-suave);color:var(--acento-texto);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--borde-campo);background:var(--tarjeta);color:var(--texto);font-size:14px}
.chip.sel{border:2px solid var(--acento);background:var(--acento-suave);color:var(--acento-texto);font-weight:600;padding:0 13px}
.chip.otro{border:1px dashed var(--punto);background:transparent;color:var(--acento);font-weight:600}
.chip.peq{min-height:36px;font-size:13px}
.atenuado{opacity:.45}
.vista-previa{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:14px;background:var(--tarjeta);border:1px solid var(--borde)}
.vista-previa .et{font-size:13px;color:var(--texto-2)}
.vista-previa .n{font-weight:600;font-size:16px}
.vista-previa .l{font-size:14px;color:var(--texto-2)}
.guardar-final{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.sugerencias{display:flex;flex-direction:column}
#hay-version{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px;border-radius:14px;background:var(--acento);color:#fff;font-size:15px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:560px;margin:0 auto}
#hay-version[hidden]{display:none}
#hay-version button{flex-shrink:0;border:0;border-radius:10px;padding:10px 14px;background:#fff;color:var(--acento);font:inherit;font-weight:700;cursor:pointer}
.aviso{padding:14px 16px;border-radius:14px;background:var(--acento-suave);color:var(--acento-texto);font-size:14px;line-height:1.45;display:flex;justify-content:space-between;gap:12px;align-items:center}
.sobre{display:flex;flex-direction:column;gap:6px}
.sobre > span{font-size:13px;color:var(--texto-2)}
.chip-sobre{font-size:14px;color:var(--texto);background:var(--tarjeta);border:1px solid var(--borde-campo);padding:7px 14px;border-radius:999px;min-height:36px}
.chip-sobre.sel{font-weight:600;color:#fff;background:var(--c,var(--boton));border:1px solid transparent}
.caja-texto{flex:1;display:flex;flex-direction:column;gap:10px;padding:18px;background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;min-height:260px}
.caja-texto label{font-size:13px;font-weight:600;color:var(--acento)}
.caja-texto textarea{flex:1;border:0;outline:0;background:transparent;resize:none;font-size:17px;line-height:1.55;padding:0;min-height:200px}
.nota-form{gap:20px}

/* =====================================================================
   7. HOJAS (diálogos), AVISOS Y AJUSTES
   ===================================================================== */
.velo{position:fixed;inset:0;z-index:200;background:var(--velo);display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--tarjeta);color:var(--texto);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;max-height:90dvh;overflow:auto;box-shadow:var(--sombra)}
@media (min-width:720px){.velo{align-items:center}.hoja{border-radius:20px}}
.hoja-titulo{margin:0;font-family:var(--f-titulo);font-weight:600;font-size:22px}
.hoja-texto{margin:0;font-size:15px;line-height:1.5;color:var(--texto-2);white-space:pre-line}
.hoja-botones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hoja-botones .btn-pri,.hoja-botones .btn-peligro{min-height:48px;border-radius:12px}
.hoja-form{display:flex;flex-direction:column;gap:16px}
.hoja-error{margin:0;color:var(--peligro);font-size:14px;min-height:0}
.paleta{display:flex;flex-wrap:wrap;gap:14px}
.paleta .circulo{width:44px;height:44px}
#aviso{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:300;background:var(--texto);color:var(--fondo);padding:12px 18px;border-radius:12px;font-size:14px;max-width:calc(100% - 40px);opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--sombra);text-align:center}
#aviso.ver{opacity:1;transform:translate(-50%,0)}
.ajuste{display:flex;flex-direction:column;gap:10px;padding:16px}
.ajuste + .ajuste{border-top:1px solid var(--linea)}
.ajuste p{margin:0;font-size:14px;color:var(--texto-2);line-height:1.45}
.ajuste .dos{gap:8px}
.cifras{display:grid;grid-template-columns:1fr 1fr;gap:0}
.cifra{padding:14px 16px;border-bottom:1px solid var(--linea);display:flex;flex-direction:column;gap:2px}
.cifra b{font-size:22px;font-family:var(--f-titulo)}
.cifra span{font-size:13px;color:var(--texto-2)}
.dup{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-bottom:1px solid var(--linea)}
.dup:last-child{border-bottom:0}
mark{background:var(--acento-suave);color:var(--acento-texto);border-radius:3px;padding:0}
.res-nota{display:flex;flex-direction:column;gap:4px;padding:12px 16px;border-bottom:1px solid var(--linea);text-decoration:none;color:var(--texto)}
.res-nota:last-child{border-bottom:0}
.res-nota .txt{font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.franja a{color:inherit;font-weight:600}

/* =====================================================================
   8. FASE 2: PROYECTOS, HITOS, COMPROMISOS E HISTORIA UNIFICADA
   ===================================================================== */
.filtros.desliza{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:0 20px 2px;scrollbar-width:none}
.filtros.desliza::-webkit-scrollbar{display:none}
.filtros.desliza .filtro{flex-shrink:0;white-space:nowrap}
.origenes{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.origen{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--texto-2);background:var(--neutro-suave);padding:3px 9px;border-radius:999px}
.origen .punto-emp{width:8px;height:8px}
.hito{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 16px;border-bottom:1px solid var(--linea)}
.hito:last-child{border-bottom:0}
.hito > a{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-decoration:none;color:var(--texto)}
.hito > a:hover{color:var(--texto)}
.hito-num{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:2px solid var(--borde-campo);color:var(--texto-2)}
.hito-num.en-curso{border-color:var(--c,var(--acento));color:var(--c,var(--acento))}
:root[data-tema="oscuro"] .hito-num.en-curso{border-color:var(--acento);color:var(--acento)}
.hito-num.cumplido{background:var(--c,var(--acento));border-color:transparent;color:#fff}
.hito .tachado{text-decoration:line-through;color:var(--texto-2)}
.mover{display:flex;flex-direction:column}
.mover button{width:36px;height:30px;border:0;background:none;color:var(--texto-2);display:flex;align-items:center;justify-content:center;padding:0}
.mover button[disabled]{opacity:.25;cursor:default}
.avance{font-size:13px;font-weight:600;color:var(--texto-2);text-transform:none;letter-spacing:0}
.comp{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--linea)}
.comp:last-child{border-bottom:0}
.comp input[type=checkbox]{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--acento);cursor:pointer}
.comp > a{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1;text-decoration:none;color:var(--texto)}
.comp > a:hover{color:var(--texto)}
.comp .d{font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.comp .s{font-size:13px;color:var(--texto-2)}
.comp .s.venc{color:var(--pend-texto);font-weight:600}
.comp.hecho .d{text-decoration:line-through;color:var(--texto-2)}
.rel-chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--borde-campo);background:var(--tarjeta);color:var(--texto);font-size:14px;display:inline-flex;align-items:center;gap:8px}
.rel-chip.sel{border:2px solid var(--acento);background:var(--acento-suave);color:var(--acento-texto);font-weight:600;padding:0 11px}
.rel-chip .punto-emp{width:9px;height:9px}
.comps-nota{display:flex;flex-direction:column;gap:0}
.comps-nota .comp{padding:12px 14px}
.quitar{border:0;background:none;color:var(--texto-2);min-width:36px;min-height:36px;font-size:20px;line-height:1;padding:0;margin-left:auto}
.marca{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--tarjeta);border:1px solid var(--borde);font-size:15px;font-weight:600;cursor:pointer}
.marca input{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--acento)}
.marca .sub{font-weight:400;margin-top:2px}
.fila-rol{padding:0;gap:0}
.fila-rol > a{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:14px 8px 14px 16px;text-decoration:none;color:var(--texto)}
.fila-rol > a:hover{color:var(--texto)}
.rol-btn{flex-shrink:0;min-height:36px;margin-right:12px;padding:0 14px;border-radius:999px;border:1px solid var(--borde-campo);background:var(--tarjeta);color:var(--acento);font-size:14px;font-weight:600}

  let html = ini ? '…' : '', cur = ini;
  for (const [a, b] of rangos) { if (b <= cur) continue; const a2 = Math.max(a, cur); html += esc(base.slice(cur, a2)) + '<mark>' + esc(base.slice(a2, b)) + '</mark>'; cur = b; }
  return html + esc(base.slice(cur, fin)) + (fin < base.length ? '…' : '');
}

/* Abre la base de datos. Solo agrega tablas e índices: nunca borra ni cambia lo guardado.
   Si el celular ya tiene una versión más nueva de la base (por ejemplo, al volver a una
   versión anterior de la app), la abre tal como está en lugar de fallar. */
function abrirDB(){

    let r;

    r.onupgradeneeded = () => {
      const d = r.result, tx = r.transaction;
      const crear = (n, idx=[]) => {
        const s = d.objectStoreNames.contains(n) ? tx.objectStore(n) : d.createObjectStore(n, {keyPath: n==='ajustes' ? 'clave' : 'id'});
        idx.forEach(i => { if (!s.indexNames.contains(i)) s.createIndex(i, i); });
      };
      crear('empresas'); crear('personas');
      crear('cargos', ['personaId','empresaId']);
      crear('reuniones', ['empresaId']);
      crear('compromisos', ['reunionId','proyectoId','hitoId']);
      crear('notas', ['refId']);
      crear('tiposVinculo'); crear('ajustes'); crear('papelera');
      /* Fase 2 */
      crear('proyectos');

      crear('papeles', ['personaId','proyectoId']);
      crear('hitos', ['proyectoId']);
      crear('hitoEnlaces', ['hitoId','refId']);
      /* 3.2 */
      crear('comites', ['empresaId']);
    };

      bloqueo.innerHTML = `<div class="pin"><div class="pin-cabeza"><div class="pin-logo">${estrella(30)}</div><h1 class="pin-nombre">${esc(APP.nombre)}</h1><p class="pin-instr">Hay otra ventana de ${esc(APP.nombre)} abierta con la versión anterior. Ciérrela para terminar de actualizar; sus datos no se tocan.</p></div></div>`;
    };
    r.onsuccess = () => { const d = r.result; d.onversionchange = () => d.close(); res(d); };
    r.onerror = e => {
      if (r.error && r.error.name === 'VersionError') {
        e.preventDefault();
        const r2 = indexedDB.open(DB_NOMBRE);
        r2.onsuccess = () => { const d = r2.result; d.onversionchange = () => d.close(); res(d); };
        r2.onerror = () => rej(r2.error);

    };

}
const pReq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const pTx = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });

/* Escribe varios cambios en una sola transacción y actualiza la copia en memoria */
async function lote({poner={}, quitar={}, vaciar=[]}){
  const nombres = [...new Set([...Object.keys(poner), ...Object.keys(quitar), ...vaciar])];
  if (!nombres.length) return;
  const t = db.transaction(nombres, 'readwrite');
  vaciar.forEach(n => t.objectStore(n).clear());
  for (const [n, objs] of Object.entries(poner)) objs.forEach(o => t.objectStore(n).put(o));
  for (const [n, ids] of Object.entries(quitar)) ids.forEach(id => t.objectStore(n).delete(id));
  await pTx(t);
  vaciar.forEach(n => { if (n==='ajustes') S.cfg = {}; else S[n] = []; });
  for (const [n, objs] of Object.entries(poner)) objs.forEach(o => {
    if (n==='ajustes') { S.cfg[o.clave] = o.valor; return; }
    const i = S[n].findIndex(x => x.id===o.id); if (i>=0) S[n][i] = o; else S[n].push(o);
  });
  for (const [n, ids] of Object.entries(quitar)) {
    if (n==='ajustes') ids.forEach(k => delete S.cfg[k]);
    else { const s = new Set(ids); S[n] = S[n].filter(x => !s.has(x.id)); }
  }
  try { contarActividad(poner); } catch (_) {}
}

   El puntaje se desvanece a la mitad cada 30 días, así pesa más lo reciente. Se guarda en ajustes ("usos") y va en el respaldo. */
const MEDIA_VIDA_USO = 30 * 864e5;

function ultimasActividades(){

  S.notas.forEach(n => refsNota(n).forEach(r => poner(r.tipo + ':' + r.id, n.fecha)));
  S.reuniones.forEach(r => { if (r.fecha && r.fecha <= hoyISO()) { poner('empresa:' + r.empresaId, r.fecha); if (r.proyectoId) poner('proyecto:' + r.proyectoId, r.fecha); [...(r.asistentes || []), ...(r.invitados || [])].forEach(p => poner('persona:' + p, r.fecha)); } });

  return m;

  const U = USOS_PEND || S.cfg.usos || {}, ahoraMs = Date.now(), ult = ultimasActividades();

/* Papelera: lo borrado se guarda 30 días y se puede restaurar */
async function aPapelera(titulo, datos, extra = {}){
  const quitar = {};
  for (const [n, objs] of Object.entries(datos)) quitar[n] = objs.map(o => o.id);
  const item = {id:uid(), creada:ahora(), titulo, datos};
  const poner = {papelera:[item]};
  for (const [n, objs] of Object.entries(extra)) poner[n] = objs;
  await lote({quitar, poner});
}
async function restaurarPapelera(id){
  const it = S.papelera.find(x => x.id === id); if (!it) return;
  const d = it.datos, enItem = (n, pid) => (d[n] || []).some(x => x.id === pid), falta = new Set();
  (d.cargos || []).forEach(c => { if (!persona(c.personaId) && !enItem('personas', c.personaId)) falta.add('la persona'); if (!empresa(c.empresaId)) falta.add('la entidad'); });
  (d.notas || []).forEach(n => {
    if (n.refTipo === 'persona' && !persona(n.refId) && !enItem('personas', n.refId)) falta.add('la persona');
    if (n.refTipo === 'empresa' && !empresa(n.refId)) falta.add('la entidad');
    if (n.refTipo === 'proyecto' && !proyecto(n.refId) && !enItem('proyectos', n.refId)) falta.add('el proyecto');
  });
  [...(d.hitos || []), ...(d.compromisos || []), ...(d.papeles || [])].forEach(x => {
    if (x.proyectoId && !proyecto(x.proyectoId) && !enItem('proyectos', x.proyectoId)) falta.add('el proyecto');
  });
  (d.papeles || []).forEach(x => { if (!persona(x.personaId) && !enItem('personas', x.personaId)) falta.add('la persona'); });
  (d.compromisos || []).forEach(x => { if (x.refTipo === 'persona' && !persona(x.refId) && !enItem('personas', x.refId)) falta.add('la persona'); });
  if (falta.size) return mensaje(`No se puede restaurar porque ${[...falta].join(' y ')} a la que pertenece ya no existe. Restaure primero ese elemento desde la papelera.`, 'No se pudo restaurar');
  await lote({poner:d, quitar:{papelera:[it.id]}});
  aviso('Restaurado'); render();
}
async function purgarPapelera(){
  const limite = Date.now() - PAPELERA_DIAS * 86400000;
  const viejos = S.papelera.filter(x => new Date(x.creada).getTime() < limite).map(x => x.id);
  if (viejos.length) await lote({quitar:{papelera:viejos}});
}

/* =====================================================================
   CIFRADO (PIN y respaldos) — Web Crypto del navegador
   ===================================================================== */
const enc = new TextEncoder(), dec = new TextDecoder();
function b64(bytes){ let s=''; const t=0x8000; for (let i=0;i<bytes.length;i+=t) s += String.fromCharCode.apply(null, bytes.subarray(i,i+t)); return btoa(s); }
function deb64(s){ const b = atob(s); const u = new Uint8Array(b.length); for (let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function hashPin(pin, salB64, iter=PIN_ITER){
  const sal = salB64 ? deb64(salB64) : crypto.getRandomValues(new Uint8Array(16));
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:sal, iterations:iter, hash:'SHA-256'}, base, 256);
  return {hash: b64(new Uint8Array(bits)), sal: b64(sal), iter};
}
async function verificarPin(pin){
  const g = S.cfg.pin; if (!g) return false;
  const h = await hashPin(pin, g.sal, g.iter);
  return h.hash === g.hash;
}
async function claveAES(pass, sal, iter){
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:sal, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}

const P = {modo:'entrar', dig:'', primero:'', fallos:0, espera:0, ocupado:false, error:'', cambiando:false, mostrarOlvido:false};
const TXT_PIN = {crear:'Cree un PIN de 4 dígitos', confirmar:'Confirme su PIN', entrar:'Ingrese su PIN', actual:'Ingrese su PIN actual'};

function bloquear({modo, cambiando=false}={}){
  bloqueada = true; cerrarHoja();
  app.hidden = true; app.innerHTML = '';
  Object.assign(P, {modo: modo || (S.cfg.pin ? 'entrar' : 'crear'), dig:'', primero:'', error:'', cambiando, ocupado:false});

    <div class="pin-teclado">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button type="button" class="pin-tecla" data-action="pin-num" data-n="${n}">${n}</button>`).join('')}
      <div></div><button type="button" class="pin-tecla" data-action="pin-num" data-n="0">0</button>

    <p class="pin-pie">Sus datos viven solo en este ${esMovil() ? 'celular' : 'dispositivo'}</p>
    <button type="button" class="pin-ligero" id="pin-ligero" hidden></button>
  </div>`;
  pinPintar();
}
function pinPintar(){
  const instr = $('#pin-instr'); if (!instr) return;
  const espera = Date.now() < P.espera;
  instr.textContent = espera ? 'Demasiados intentos. Espere 30 segundos.' : (P.error || TXT_PIN[P.modo]);
  instr.classList.toggle('error', !!P.error || espera);
  const pts = $('#pin-puntos');
  pts.innerHTML = [0,1,2,3].map(i => `<div class="${i < P.dig.length ? 'lleno' : ''}"></div>`).join('');
  pts.setAttribute('aria-label', `${P.dig.length} de 4 dígitos ingresados`);
  $('#pin-entrar').textContent = (P.modo==='crear' || P.modo==='actual') ? 'Continuar' : (P.modo==='confirmar' ? 'Guardar PIN' : 'Entrar');
  const lig = $('#pin-ligero');
  if (P.cambiando) { lig.hidden = false; lig.textContent = 'Cancelar'; lig.dataset.action = 'pin-cancelar'; }
  else if (P.modo==='entrar' && P.mostrarOlvido) { lig.hidden = false; lig.textContent = '¿Olvidó su PIN?'; lig.dataset.action = 'pin-olvido'; }
  else lig.hidden = true;
}
function pinTecla(n){
  if (P.ocupado || P.dig.length >= 4 || Date.now() < P.espera) return;
  P.dig += n; P.error = ''; pinPintar();
  if (P.dig.length === 4) setTimeout(pinEnviar, 140);
}
function pinBorrar(){ if (P.ocupado) return; P.dig = P.dig.slice(0,-1); pinPintar(); }
function pinError(msg){
  P.error = msg; P.dig = '';
  const pts = $('#pin-puntos'); if (pts) { pts.classList.remove('sacude'); void pts.offsetWidth; pts.classList.add('sacude'); }
  if (navigator.vibrate) navigator.vibrate(120);
}
async function pinEnviar(){
  if (P.ocupado || Date.now() < P.espera) return;
  if (P.dig.length < 4) { P.error = 'Ingrese los 4 dígitos'; pinPintar(); return; }
  P.ocupado = true;
  try {
    if (P.modo === 'crear') { P.primero = P.dig; P.dig = ''; P.modo = 'confirmar'; }
    else if (P.modo === 'confirmar') {
      if (P.dig !== P.primero) { P.modo = 'crear'; P.primero = ''; pinError('Los PIN no coinciden. Empiece de nuevo.'); }
      else {
        await setAjuste('pin', await hashPin(P.dig));
        const cambio = P.cambiando; P.dig = ''; P.ocupado = false;
        desbloquear(); aviso(cambio ? 'PIN actualizado' : 'PIN creado. Lo pediremos cada vez que entre.');
        return;
      }
    } else {
      const ok = await verificarPin(P.dig);
      if (ok) {
        P.fallos = 0; P.dig = '';
        if (P.modo === 'actual') P.modo = 'crear';
        else { P.ocupado = false; desbloquear(); return; }
      } else {
        P.fallos++; P.mostrarOlvido = true;
        if (P.fallos >= 5) { P.fallos = 0; P.espera = Date.now() + 30000; P.dig = ''; setTimeout(pinPintar, 30100); }
        else pinError('PIN incorrecto. Intente de nuevo.');
      }
    }
  } finally { P.ocupado = false; pinPintar(); }
}
function desbloquear(){
  bloqueada = false; bloqueo.hidden = true; bloqueo.innerHTML = '';
  app.hidden = false; P.cambiando = false;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render();
}

function origenesNota(n, sujeto){

  if (rj) et.push(`<span class="origen">${esc(etiquetaJunta(rj))}</span>`);
  const h = n.hitoId && hito(n.hitoId);
  if (h) { const n2 = hitosProyecto(h.proyectoId).findIndex(x => x.id===h.id) + 1; et.push(`<span class="origen">Hito ${n2}: ${esc(h.nombre)}</span>`); }

/* 3.31 · Reuniones, notas y decisiones de la Historia: abiertas o cerradas y agrupadas por mes y año */
const HIST_AB = new Set();
function listaTL(titulo, xs){ return xs.length ? `<h3 class="tl-sub">${titulo}</h3><ul class="tl-lista">${xs.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''; }
function itemReunionTL(r, i, ult){
  const temas = (r.temas || []).filter(Boolean), dec = (r.decisiones || []).filter(Boolean), k = 'reu-' + r.id, ab = HIST_AB.has(k);
  const res = [temas.length ? plural(temas.length, 'tema') : '', dec.length ? plural(dec.length, 'decisión', 'decisiones') : ''].filter(Boolean).join(' · ');
  return `<div class="tl-item tl-reu${i===0 ? ' primera' : ''}${ab ? ' abierta' : ''}" data-ab="${k}">
      <div class="tl-eje"><div class="tl-punto" style="background:var(--acento)"></div>${ult ? '' : '<div class="tl-linea"></div>'}</div>
      <div class="tl-cuerpo${ult ? '' : ' espacio'}" style="flex:1">
        <button type="button" class="tl-reu-cab" data-action="hist-ab" aria-expanded="${ab}"><span class="col"><span class="tl-fecha">${esc([fechaMedia(r.fecha), ocasionJunta(r)].join(' · '))}</span><span class="tl-reu-res">${esc(res)}</span></span><span class="pleg-flecha">${I.plegar}</span></button>
        <div class="tl-reu-cuerpo">${listaTL('Temas tratados', temas)}${listaTL(dec.length === 1 ? 'Decisión tomada' : 'Decisiones tomadas', dec)}
          <div class="tl-reu-acc">${temas.length ? (r.mapa ? `<a class="btn-ia" href="#/mapa/${r.id}">${ICONO_IA}Ver mapa mental</a>` : iaClave() ? `<button type="button" class="btn-ia" data-action="mapa-hacer" data-id="${r.id}">${ICONO_IA}Hacer mapa mental</button>` : '') : ''}
          <a class="enlace-btn" style="font-size:14px" href="#/junta/${r.id}">Abrir ficha ›</a></div></div></div></div>`;
}
/* Filtro "Decisiones": una entrada por reunión, solo con sus decisiones */
function filtroDecisiones(lista){
  const xs = itemsDecision(lista), n = xs.reduce((t, x) => t + x._d.decisiones.filter(Boolean).length, 0);
  return xs.length ? [{k:'dec', txt:'Decisiones', lista:xs, n}] : [];
}
function itemsDecision(lista){
  return itemsReunion(lista).filter(x => (x._r.decisiones || []).some(Boolean)).map(x => ({...x, _r:null, _d:x._r, id:'dec-' + x._r.id}));
}
function itemDecisionTL(r, i, ult){
  const dec = (r.decisiones || []).filter(Boolean);
  return `<a class="tl-item${i===0 ? ' primera' : ''}" href="#/junta/${r.id}" aria-label="Abrir ${esc(ocasionJunta(r))} del ${esc(fechaMedia(r.fecha))}">
      <div class="tl-eje"><div class="tl-punto" style="background:var(--acento)"></div>${ult ? '' : '<div class="tl-linea"></div>'}</div>
      <div class="tl-cuerpo${ult ? '' : ' espacio'}"><span class="tl-fecha">${esc([fechaMedia(r.fecha), ocasionJunta(r)].join(' · '))}</span><ul class="tl-lista">${dec.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div></a>`;
}
function itemTL(n, i, ult, sujeto){
  if (n._r) return itemReunionTL(n._r, i, ult);
  if (n._d) return itemDecisionTL(n._d, i, ult);
  const titulo = [fechaMedia(n.fecha), n.ocasion].filter(Boolean).join(' · ');
  return `<a class="tl-item${i===0 ? ' primera' : ''}" href="#/nota/${n.id}" aria-label="Editar nota del ${esc(fechaMedia(n.fecha))}">
      <div class="tl-eje"><div class="tl-punto"></div>${ult ? '' : '<div class="tl-linea"></div>'}</div>
      <div class="tl-cuerpo${ult ? '' : ' espacio'}"><span class="tl-fecha">${esc(titulo)}</span>${origenesNota(n, sujeto)}<span class="tl-texto">${esc(n.texto)}</span></div></a>`;
}
function lineaTiempo(notas, sujeto, vacio, clave){
  if (!notas.length) return `<p class="tarjeta vacio">${vacio || 'Aún no hay notas. Use el botón de abajo para agregar la primera.'}</p>`;
  const items = [...notas].sort(ordenNotas);
  /* Agrupa por año y mes; el año más reciente queda abierto y los anteriores se pliegan */
  const anios = new Map();
  items.forEach(n => { const y = (n.fecha || '').slice(0, 4) || 'sin', m = (n.fecha || '').slice(0, 7) || 'sin';
    if (!anios.has(y)) anios.set(y, new Map()); const ms = anios.get(y); if (!ms.has(m)) ms.set(m, []); ms.get(m).push(n); });
  let i = 0;
  const meses = ms => [...ms].map(([m, xs]) => `<div class="tl-grupo"><h3 class="tl-mes">${m === 'sin' ? 'Sin fecha' : capitalizar(MESES_L[+m.slice(5, 7) - 1]) + ' ' + m.slice(0, 4)}</h3><div class="tl">${xs.map((n, j) => itemTL(n, i++, j === xs.length - 1, sujeto)).join('')}</div></div>`).join('');
  return [...anios].map(([y, ms], a) => {
    if (a === 0) return meses(ms);
    const k = 'anio:' + (clave || '') + ':' + y, ab = HIST_AB.has(k), n = [...ms.values()].reduce((t, xs) => t + xs.length, 0);
    return `<div class="tarjeta col plegable tl-anio${ab ? ' abierta' : ''}" data-ab="${esc(k)}" style="gap:0"><button type="button" class="pleg-cab" data-action="hist-ab" aria-expanded="${ab}">
      <span class="pleg-res"><span class="nom">${y === 'sin' ? 'Sin fecha' : y}</span><span class="sub">${esc(plural(n, 'registro'))}</span></span><span class="pleg-flecha">${I.plegar}</span></button>
      <div class="pleg-cuerpo">${meses(ms)}</div></div>`;
  }).join('');
}
/* Historia unificada con filtros. Cada filtro es {k, txt, f} (sobre la lista base) o {k, txt, lista} (otra lista) */
const HIST = {};
function historia(sujeto, base, filtros){
  const clave = sujeto.tipo + ':' + sujeto.id;
  const todos = [{k:'todo', txt:'Todo', lista:base}, ...filtros.map(f => ({...f, lista: f.lista || base.filter(f.f)}))].filter(f => f.k==='todo' || f.lista.length);
  const act = todos.find(f => f.k === HIST[clave]) || todos[0];
  const chips = todos.length > 1 ? `<div class="filtros desliza" role="group" aria-label="Filtrar historia">${todos.map(f => `<button type="button" class="filtro${f===act ? ' act' : ''}" data-action="hist" data-clave="${esc(clave)}" data-k="${esc(f.k)}" aria-pressed="${f===act}">${esc(f.txt)} · ${f.n ?? f.lista.length}</button>`).join('')}</div>` : '';
  const ayuda = act.k === 'gente' ? '<p class="ayuda" style="margin:0">Notas de las personas de esta entidad, como referencia.</p>' : '';
  const ayudaDec = act.k === 'dec' ? '<p class="ayuda" style="margin:0">Las decisiones de cada reunión, de la más reciente a la más antigua.</p>' : '';
  return chips + ayuda + ayudaDec + lineaTiempo(act.lista, sujeto, act.k === 'todo' ? '' : 'No hay nada en este filtro.', clave);
}
/* Un filtro por cada entidad o proyecto que aparece en las notas */
function filtrosPorRef(notas, sujeto, tipos){
  const vistos = new Map();
  notas.forEach(n => refsNota(n).forEach(r => {
    if (!tipos.includes(r.tipo) || (r.tipo===sujeto.tipo && r.id===sujeto.id)) return;
    const o = objetoRef(r.tipo, r.id); if (o) vistos.set(r.tipo + ':' + r.id, {r, o});
  }));
  return [...vistos.values()].sort((a,b) => compararTexto(a.o.nombre, b.o.nombre))
    .map(({r, o}) => ({k: r.tipo + ':' + r.id, txt: o.nombre, f: n => tocaA(n, r.tipo, r.id)}));
}
/* Iniciales del proyecto sin la palabra “Proyecto”; con una sola palabra, sus dos primeras letras */
function inicialesProyecto(n){ const w = String(n || '').replace(/^proyecto\s+/i, '').trim(); const i = iniciales(w); return i.length > 1 ? i : (w.slice(0, 2).toUpperCase() || '?'); }
/* Sección "Compromisos" de una persona o entidad: abiertos y los últimos cumplidos */
function seccionCompromisos(lista, sujeto, hrefNuevo, sinEnvoltura){
  const cab = `<div class="sec-fila"><h2 class="sec-titulo" style="color:var(--pend-texto)">Compromisos</h2><a class="enlace-btn" style="font-size:14px" href="${hrefNuevo}">+ Agregar</a></div>`;
  const cuerpo = lista.length ? `<div class="tarjeta col" style="gap:0">${lista.map(c => filaCompromiso(c, {conProyecto:true, excluir:sujeto})).join('')}</div>` : `<p class="tarjeta vacio">Sin compromisos.</p>`;
  return sinEnvoltura ? cab + cuerpo : `<div class="sec">${cab}${cuerpo}</div>`;
}
function filaProyecto(p){
  const et = p.archivado ? {txt: 'En el archivo' + (lineaArchivo(p) ? ' · ' + lineaArchivo(p) : ''), venc:false} : lineaEtapa(p);
  return `<a class="fila" href="#/proyecto/${p.id}" style="--c:${cv(p.color)}"><span class="punto-emp" aria-hidden="true"></span><span class="col"><span class="nom">${esc(p.nombre)}</span><span class="sub${et.venc ? ' pend' : ''}">${esc(et.txt)}</span></span>${I.chev}</a>`;
}

/* ---------- 4 · Persona ---------- */

  const ctx = pCtx ? null : ((q.e && (cs.find(c => c.empresaId===q.e && vigente(c)) || cs.find(c => c.empresaId===q.e))) || vig[0] || cs[0]);

  const acc = (href, icono, txt) => href ? `<a class="per-acc" href="${esc(href)}"${href.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>${icono}${txt}</a>` : `<span class="per-acc" aria-disabled="true">${icono}${txt}</span>`;
  const wa = numeroWhatsApp(p.telefono);
  const reporta = ctx ? nombreReporta(ctx) : '';
  const datos = [
    p.telefono && `<div class="dato"><span>Celular</span><a href="tel:${esc(telHref)}">${esc(p.telefono)}</a></div>`,
    p.waUsuario && `<div class="dato"><span>Usuario WhatsApp</span><button type="button" class="enlace-btn" style="padding:0;min-height:0;font-weight:400;text-decoration:underline" data-action="wa-usuario" data-u="${esc(p.waUsuario)}">@${esc(p.waUsuario)}</button></div>`,
    p.telefono2 && `<div class="dato"><span>Otro teléfono</span><a href="${esc(hrefTel(p.telefono2, p.ext2))}">${esc(p.telefono2)}${p.ext2 ? ' ext. ' + esc(p.ext2) : ''}</a></div>`,
    p.correo && `<div class="dato"><span>Correo</span><a href="mailto:${esc(p.correo)}">${esc(p.correo)}</a></div>`,
    p.comoLaConocio && `<div class="dato"><span>${p.trato==='él' ? 'Lo conocí' : 'La conocí'}</span><span>${esc(p.comoLaConocio)}</span></div>`,
    p.cumpleanos && `<div class="dato"><span>Cumpleaños</span><span>${esc(cumpleTexto(p.cumpleanos))}</span></div>`,
    p.linkedin && `<div class="dato"><span>LinkedIn</span><a href="${esc(/^https?:\/\//.test(p.linkedin) ? p.linkedin : 'https://' + p.linkedin)}" target="_blank" rel="noopener">Ver perfil</a></div>`,
    otrosConAsistente(p) && `<div class="dato"><span>Otros</span><span style="white-space:pre-line">${esc(otrosConAsistente(p))}</span></div>`
  ].filter(Boolean).join('');
  const titPerfil = p.trato==='ella' ? 'Mi perfil de ella' : p.trato==='él' ? 'Mi perfil de él' : 'Mi perfil';
  const notasP = S.notas.filter(n => tocaA(n, 'persona', id));
  const pronombre = p.trato==='él' ? 'él' : p.trato==='ella' ? 'ella' : 'esta persona';
  const filaPapel = x => { const pr = proyecto(x.proyectoId); if (!pr) return '';
    const fechas = x.fin && !vigente(x) ? `Ya no está · desde ${fechaCorta(x.fin)}` : (x.inicio ? 'Desde ' + mesAnio(x.inicio) : '');
    return `<div class="fila fila-rol${vigente(x) ? '' : ' atenuado'}" style="--c:${cv(pr.color)}"><a href="#/proyecto/${pr.id}"><span class="punto-emp" aria-hidden="true"></span><span class="col"><span class="nom">${esc(pr.nombre)}${proyectoActivo(pr) ? '' : ` <span class="sub">(${pr.archivado ? 'en el archivo' : 'proyecto cerrado'})</span>`}</span><span class="sub">${esc(x.papel || 'Rol sin definir')}</span>${fechas ? `<span class="sub">${esc(fechas)}</span>` : ''}</span></a><button type="button" class="rol-btn" data-action="rol-hoja" data-id="${x.id}" aria-label="Rol en ${esc(pr.nombre)}">Rol</button></div>`; };
  const filaCargo = x => { const e = empresa(x.empresaId); if (!e) return '';
    const fechas = x.fin && !vigente(x) ? `${x.inicio ? mesAnio(x.inicio) + ' – ' : 'Hasta '}${mesAnio(x.fin)} · cerrado` : (x.inicio ? 'Desde ' + mesAnio(x.inicio) : '');
    return `<a class="fila" href="#/cargo/${x.id}" style="--c:${cv(e.color)}"><span class="punto-emp" aria-hidden="true"></span><span class="col"><span class="nom">${esc(e.nombre)}${e.archivada ? ' <span class="sub">(en el archivo)</span>' : ''}</span><span class="sub">${esc([x.rolJunta, x.cargo, x.area, txtRep(x)].filter(Boolean).join(' · ') || 'Sin cargo')}</span>${fechas ? `<span class="sub">${esc(fechas)}</span>` : ''}</span>${I.chev}</a>`; };

  pintar(`<div style="--c:${c}">

        ${jefesDe(id).length ? `<span class="sub">Asistente de ${jefesDe(id).map(j => `<a href="#/persona/${j.id}">${esc(j.nombre)}</a>`).reduce((t, x, i, l) => t + (i === 0 ? '' : i === l.length - 1 ? ' y ' : ', ') + x, '')}</span>` : ''}</div></div>
    <div class="per-acciones">${acc(telHref && 'tel:' + telHref, I.tel, 'Llamar')}${acc(p.correo && 'mailto:' + p.correo, I.correo, 'Correo')}${botonWA(p, 'per-acc', I.mensaje + 'WhatsApp')}</div>
  </div></div>
  <div class="pagina con-accion">
    ${seccionAsistentes(p)}
    ${(() => { const b = bloquePulso('persona', id); return b ? `<div class="sec"><h2 class="sec-titulo">Pulso · 12 meses</h2><div class="tarjeta" style="padding:14px 16px">${b}</div></div>` : ''; })()}
    <div class="sec"><h2 class="sec-titulo">Datos</h2>${datos ? `<div class="tarjeta datos">${datos}</div>` : `<p class="tarjeta vacio">Sin datos de contacto. Toque “Editar” para agregarlos.</p>`}</div>
    <div class="sec"><div class="sec-fila"><h2 class="sec-titulo">Entidades y cargos</h2><a class="enlace-btn" style="font-size:14px" href="#/cargo?p=${id}">+ Agregar</a></div>

      return `<a class="fila" href="#/comite/${cm.id}" style="--c:${cv(en?.color)}"><span class="punto-emp" aria-hidden="true"></span><span class="col"><span class="nom">${esc(nombreComite(cm))}</span><span class="sub">${esc([papel, en?.nombre || ''].filter(Boolean).join(' · '))}</span></span>${I.chev}</a>`; }).join('')}</div></div>` : ''}
    <div class="sec"><div class="sec-fila"><h2 class="sec-titulo">Proyectos y roles</h2><a class="enlace-btn" style="font-size:14px" href="#/papel?p=${id}">+ Agregar</a></div>
      ${pps.length ? `<div class="tarjeta col" style="gap:0">${pps.map(filaPapel).join('')}</div>` : `<p class="tarjeta vacio">No participa en ningún proyecto.</p>`}</div>
    ${seccionCompromisos(ordenParaLista(compromisosPersona(id)), {tipo:'persona', id}, `#/compromiso?persona=${id}`)}
    <div class="sec"><h2 class="sec-titulo">${titPerfil}</h2>${p.perfil ? `<p class="tarjeta parrafo">${esc(p.perfil)}</p>` : `<p class="tarjeta vacio">Aún no ha escrito un perfil. Toque “Editar”.</p>`}</div>
    <div class="sec" style="padding-bottom:32px"><h2 class="sec-titulo">Historia</h2>${historia({tipo:'persona', id}, notasP, [
      {k:'propias', txt:'Solo sobre ' + pronombre, f: n => n.refTipo==='persona' && n.refId===id},
      {k:'juntas', txt:'Juntas', f: n => !!n.reunionId && !!reunion(n.reunionId)},
      ...filtrosPorRef(notasP, {tipo:'persona', id}, ['empresa','proyecto'])
    ])}</div>
  </div>
  <div class="accion-fija"><a class="btn-pri" href="#/nota?persona=${id}${pCtx ? '&proy=' + pCtx.id : eCtx ? '&e=' + eCtx.id : ''}">${I.mic}Dictar nota</a></div>
  </div>`);
}

/* Asistentes en la ficha del jefe: nombre (abre su ficha) y botones para llamar, WhatsApp y correo */
function seccionAsistentes(p){
  const as = asistentesDe(p), legado = !as.length && asistenteTexto(p);
  if (!as.length && !legado) return '';
  const boton = (href, icono, txt) => href ? `<a class="btn-mini" href="${esc(href)}"${href.startsWith('http') ? ' target="_blank" rel="noopener"' : ''} aria-label="${esc(txt)}">${icono}</a>` : `<span class="btn-mini" aria-disabled="true" aria-label="${esc(txt)}: sin dato">${icono}</span>`;
  const fila = a => { const cg = cargosPersona(a.id).find(vigente), e = cg && empresa(cg.empresaId), wa = numeroWhatsApp(a.telefono);
    return `<div class="fila fila-rol"><a href="#/persona/${a.id}"><div class="av" aria-hidden="true">${esc(iniciales(a.nombre))}</div><span class="col"><span class="nom">${esc(a.nombre)}</span><span class="sub">${esc(cg ? [cg.cargo || cg.rolJunta, e?.nombre].filter(Boolean).join(' · ') : 'Asistente')}</span></span></a>
      <span class="mini-acc">${boton(a.telefono && hrefTel(a.telefono), I.tel, 'Llamar a ' + a.nombre)}${botonWA(a, 'btn-mini', I.mensaje, 'WhatsApp a ' + a.nombre)}${boton(a.correo && 'mailto:' + a.correo, I.correo, 'Correo a ' + a.nombre)}</span></div>`; };
  const aviso = legado ? `<div class="franja info">${I.info}<span class="col"><span class="franja-t">Asistente anotado: ${esc([legado.nombre, legado.tel].filter(Boolean).join(' · '))}</span><span class="franja-s">Conviértalo en persona para llamarlo, escribirle o enlazarlo.</span></span><button type="button" class="enlace-btn" style="margin-left:auto;color:inherit" data-action="as-convertir" data-id="${p.id}">Convertir</button></div>` : '';
  return `<div class="sec"><h2 class="sec-titulo">${as.length > 1 ? 'Asistentes' : 'Asistente'}</h2>${as.length ? `<div class="tarjeta col" style="gap:0">${as.map(fila).join('')}</div>` : ''}${aviso}</div>`;
}
async function convertirAsistente(pid){
  const p = persona(pid), t = p && asistenteTexto(p); if (!t) return;
  if (!t.nombre) return mensaje('El asistente anotado no tiene nombre. Edite la persona y agréguelo en “Asistentes”.');
  const ya = S.personas.find(x => x.id !== pid && norm(x.nombre) === norm(t.nombre));
  const poner = {personas:[]};
  let aid = ya?.id;
  if (!ya) { aid = uid(); poner.personas.push({id:aid, creada:ahora(), nombre:t.nombre, trato:'', telefono:t.tel, correo:'', comoLaConocio:'', perfil:'', foto:null}); }
  const otros = t.linea ? String(p.otros || '').split('\n').filter(l => l !== t.linea).join('\n').trim() : p.otros;
  poner.personas.push({...p, asistentes:[...new Set([...(p.asistentes || []), aid])], asistente:'', asistenteTel:'', otros, editada:ahora()});
  await lote({poner});
  aviso(ya ? `${t.nombre} quedó como asistente (ya existía)` : `${t.nombre} quedó creada como asistente`); render();
}

/* ---------- 6 · Nota (escrita o dictada con el micrófono del teclado) ---------- */
let temporizadorBorrador = null;
function guardarBorrador(ya){
  clearTimeout(temporizadorBorrador);

async function guardarEmpresa(){
  const nombre = FE.nombre.trim();
  if (!nombre) { $('#fe-nombre').setAttribute('aria-invalid','true'); $('#fe-nombre').focus(); aviso('Escriba el nombre de la entidad.'); return; }
  let participacion = null;
  if (FE.partSel === 'con') {
    const v = parseFloat(FE.pctTxt.replace('%','').replace(',','.'));
    if (!(v > 0 && v <= 100)) { $('#fe-pct').setAttribute('aria-invalid','true'); $('#fe-pct').focus(); aviso('Escriba un porcentaje entre 0 y 100.'); return; }
    participacion = Math.round(v * 100) / 100;
  }
  if (!FE.vinculoId) { aviso('Escoja su vínculo con la entidad.'); return; }
  const nueva = FE._para === 'nueva';
  if (S.empresas.some(e => e.id !== FE._para && norm(e.nombre) === norm(nombre))) {
    if (!await confirmar(`Ya existe una entidad llamada “${nombre}”. ¿Guardar de todos modos?`, {si:'Guardar'})) return;
  }
  const cambios = {empresas:[]};
  let base;
  if (nueva) { const sc = siguienteColor(); base = {id:uid(), creada:ahora(), color:sc.color, archivada:false}; cambios.ajustes = [{clave:'colorSiguiente', valor:sc.siguiente}]; }
  else base = empresa(FE._para);
  const e = {...base, nombre, participacion, vinculoId:FE.vinculoId, detalle:FE.detalle.trim(), sector:FE.sector.trim(), ciudad:FE.ciudad.trim(), editada:ahora()};
  cambios.empresas.push(e);
  await lote({poner:cambios});
  FE = null; aviso('Entidad guardada');
  if (nueva) reemplazar('#/empresa/' + e.id); else volver('#/empresa/' + e.id);
}

function hojaDatosContacto(c, nueva){
  return new Promise(res => {
    const unicos = l => [...new Map((l || []).map(x => String(x || '').trim()).filter(Boolean).map(x => [x.replace(/[\s()-]/g, '').toLowerCase(), x])).values()];
    const nombres = unicos(c.name), tels = unicos(c.tel), correos = unicos(c.email);
    const actual = {nombre: FP.nombre.trim(), tel: FP.telefono.trim(), tel2: FP.telefono2.trim(), correo: FP.correo.trim()};
    /* Si no hay nada que escoger y la persona es nueva, se llena directo */
    if (nueva && nombres.length <= 1 && tels.length <= 1 && correos.length <= 1) return res({nombre:nombres[0], tel:tels[0], correo:correos[0]});
    const grupo = (k, titulo, lista, act, iniSel) => {
      if (!lista.length) return '';
      const ops = lista.map((x, i) => `<label class="marca" style="padding:12px 14px"><input type="radio" name="hdc-${k}" value="${i}"${i === iniSel ? ' checked' : ''}><span>${esc(x)}</span></label>`).join('');
      const no = act || !nueva || k === 'tel2' ? `<label class="marca" style="padding:12px 14px;font-weight:400"><input type="radio" name="hdc-${k}" value=""${iniSel === -1 ? ' checked' : ''}><span>${act ? 'Dejar el actual: ' + esc(act) : 'No traer'}</span></label>` : '';
      return `<fieldset><legend>${titulo}</legend>${ops}${no}</fieldset>`;
    };
    /* Al editar, el nombre se deja igual salvo que se escoja; teléfono y correo se proponen del contacto */
    const v = abrirHoja(`<h2 class="hoja-titulo">¿Qué datos traer?</h2>
      <p class="hoja-texto">Escoja ${nueva ? '' : 'qué reemplazar: '}el teléfono y el correo que quiera usar.</p>
      <form class="hoja-form" novalidate>
        ${grupo('tel', 'Celular', tels, actual.tel, 0)}
        ${tels.length > 1 ? grupo('tel2', 'Otro teléfono', tels, actual.tel2, -1) : ''}
        ${grupo('correo', 'Correo', correos, actual.correo, 0)}
        ${grupo('nombre', 'Nombre', nombres, actual.nombre, nueva ? 0 : -1)}
        <div class="hoja-botones"><button type="button" class="btn-sec" data-r="0">Cancelar</button><button type="submit" class="btn-pri">Usar estos datos</button></div>
      </form>`, val => res(val || null));
    $('[data-r]', v).addEventListener('click', () => cerrarHoja(null));
    $('form', v).addEventListener('submit', e => {
      e.preventDefault();
      const valor = (k, l) => { const x = $(`input[name="hdc-${k}"]:checked`, v); return x && x.value !== '' ? l[+x.value] : undefined; };
      cerrarHoja({nombre: valor('nombre', nombres), tel: valor('tel', tels), tel2: valor('tel2', tels), correo: valor('correo', correos)});
    });
  });
}

function sugerirPersonas(){
  const cont = $('#fp-sug'); const q = norm(FP.nombre);
  if (q.length < 2) { cont.hidden = true; return; }

  cont.hidden = false;
